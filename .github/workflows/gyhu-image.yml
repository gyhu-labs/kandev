# gyhu-labs fork only: verify the carried patch and publish our server image.
#
# Branch pushes run the checks. A tag v<upstream>-gyhu.<n> also builds
# ghcr.io/gyhu-labs/kandev:<upstream>-gyhu.<n> (no leading "v", like upstream's
# image tags) from Dockerfile.gyhu. Never publishes :latest.
name: gyhu image

on:
  push:
    branches: ["feat/**", "fix/**"]
    tags: ["v*-gyhu.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gyhu-image-${{ github.ref }}
  cancel-in-progress: false

env:
  # Upstream release the fork branch is based on; lint reports new issues only.
  BASE_REF: v0.103.1

jobs:
  verify:
    name: Verify patch (tests, vet, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream base tag
        run: git fetch --no-tags https://github.com/kdlbs/kandev.git "refs/tags/${BASE_REF}:refs/tags/${BASE_REF}"
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0 + upstream dependency refresh
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: |
            apps/backend/go.sum
            pluginsdk/go.sum
      - name: Test touched packages
        run: |
          go test -trimpath -race -count=1 \
            ./cmd/agentctl/... \
            ./internal/agent/handlers/... \
            ./internal/agent/kubernetes/... \
            ./internal/agent/runtime/agentctl/... \
            ./internal/agent/runtime/lifecycle/... \
            ./internal/kubernetes/... \
            ./internal/task/changes/...
      - name: Test the lifecycle adapter's Git status gate
        run: |
          go test -trimpath -race -count=1 \
            -run 'TestLifecycleAdapterGitStatusWithDetails' ./internal/backendapp/
      - name: Vet touched packages
        run: |
          go vet ./cmd/agentctl/... ./internal/agent/handlers/... ./internal/agent/kubernetes/... \
            ./internal/agent/runtime/agentctl/... ./internal/agent/runtime/lifecycle/... \
            ./internal/backendapp/... ./internal/kubernetes/... \
            ./internal/task/service/... ./internal/task/changes/...
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l cmd/agentctl internal/agent/handlers internal/agent/kubernetes internal/agent/runtime/agentctl internal/agent/runtime/lifecycle internal/backendapp internal/kubernetes internal/task/service internal/task/changes)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: golangci-lint (new issues since the base tag)
        env:
          GOMAXPROCS: "2"
          GOMEMLIMIT: 3GiB
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          "$(go env GOPATH)/bin/golangci-lint" run \
            ./cmd/agentctl/... ./internal/agent/handlers/... ./internal/agent/kubernetes/... \
            ./internal/agent/runtime/agentctl/... ./internal/agent/runtime/lifecycle/... \
            ./internal/kubernetes/... ./internal/task/changes/... \
            --new-from-rev="${BASE_REF}" --timeout=15m --concurrency=2

  image:
    name: Build and push image
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-gyhu.')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Derive versions
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          image_tag="${tag#v}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          # Build metadata keeps update checks comparing against the upstream release.
          echo "kandev_version=${tag%%-gyhu.*}+gyhu.${tag##*-gyhu.}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - name: Build web bundle
        env:
          KANDEV_VERSION: ${{ steps.version.outputs.kandev_version }}
          VITE_KANDEV_API_PORT: ""
          VITE_KANDEV_DEBUG: ""
        run: |
          set -euo pipefail
          pnpm -C apps install --frozen-lockfile
          pnpm -C apps --filter @kandev/web build
          cp -R apps/web/dist/. apps/backend/internal/webapp/embedded/generated/
          test -f apps/backend/internal/webapp/embedded/generated/index.html
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.gyhu
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/gyhu-labs/kandev:${{ steps.version.outputs.image_tag }}
          build-args: |
            KANDEV_VERSION=${{ steps.version.outputs.kandev_version }}
            KANDEV_COMMIT=${{ steps.version.outputs.commit }}
            KANDEV_BUILD_TIME=${{ steps.version.outputs.build_time }}
      - name: Record digest
        run: |
          echo "image: ghcr.io/gyhu-labs/kandev:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
